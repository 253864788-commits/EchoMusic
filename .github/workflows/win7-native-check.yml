name: Win7 compatibility native check

on:
  push:
    branches:
      - win7-compat
    paths:
      - 'native/**'
      - '.github/workflows/win7-native-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-native-check:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust nightly with Win7 target build support
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Cargo check native addons with Node-API 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $crates = @(
            'echo-audio-player',
            'echo-audio-capture',
            'echo-media-controls',
            'echo-sqlite-store',
            'echo-opencc',
            'echo-upnp',
            'echo-airplay',
            'echo-platform-adaptor'
          )
          foreach ($crate in $crates) {
            Write-Host "Checking $crate"
            Push-Location "native/$crate"
            try {
              cargo +nightly check -Z build-std=std,panic_unwind --locked --target x86_64-win7-windows-msvc
              if ($LASTEXITCODE -ne 0) { throw "cargo check failed: $crate" }
            }
            finally {
              Pop-Location
            }
          }
